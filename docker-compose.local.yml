services:
  yamtrack:
    container_name: yamtrack-app
    image: ghcr.io/fuzzygrim/yamtrack
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=${TIMEZONE:-Etc/UTC}
      - SECRET=${YAMTRACK_SECRET}
      - REDIS_URL=redis://redis:6379
      - TRAKT_API=${TRAKT_CLIENT_ID}
      - TRAKT_SECRET=${TRAKT_CLIENT_SECRET:-""}
    ports:
      - "8000:8000"
    volumes:
      - ${YAMTRACK_DB_PATH:-./db}:/yamtrack/db
    networks:
      local:
        ipv4_address: 172.${SUBNET_NUMBER:-20}.0.2

  redis:
    container_name: yamtrack-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - ${YAMTRACK_REDIS_PATH:-./redis}:/data
    networks:
      local:
        ipv4_address: 172.${SUBNET_NUMBER:-20}.0.3

networks:
  local:
    ipam:
      config:
        - subnet: 172.${SUBNET_NUMBER:-20}.0.0/16